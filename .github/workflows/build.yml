# 云端门禁：把"本机记得跑 verify"变成"推上去就跑"。
# 三步顺序有讲究：
#   1) update + git diff --exit-code —— 抓"改了源文件却忘了 update 就提交"（生成物在库里，漂移看得见）
#   2) build —— 编译 + 产物断言（强符号、镜像容量、BSP 接入）
#   3) verify --artifacts —— 对现成产物再验一遍，防止 build 复用了旧 .o 造成假绿
# 检出用 lfs: false：构建不需要 doc/ 下的 PDF，指针文件就够，别烧 LFS 下载额度。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出（跳过 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 ARM 工具链
        uses: actions/cache@v4
        with:
          path: tool/linux_x86_64
          key: arm-gnu-${{ runner.os }}-${{ hashFiles('build/contracts.py') }}
          restore-keys: |
            arm-gnu-${{ runner.os }}-

      # 工具链进 tool/linux_x86_64，和本机 tool/win_x86_64 是同一个版本号，
      # 版本由 build/environment.py 的 DEFAULT_TOOLCHAIN_VERSION 固定，别在这里另指定。
      - name: 安装 ARM 工具链
        run: python3 build/build.py install-toolchain

      - name: 刷新描述文件并自检
        run: python3 build/build.py update

      # 生成物入库是本工程的既定策略；这一条保证它们不会和源码脱节。
      - name: 生成物必须与提交内容一致
        run: |
          git diff --stat
          git diff --exit-code

      - name: 全量构建
        run: python3 build/build.py build

      - name: 产物断言
        run: python3 build/build.py verify --artifacts

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: stm32-freertos-target
          path: out/release/
          if-no-files-found: error

  # 发布档位（-Os -g1）：`make release` 会换掉 OPT/DEBUG，体积读数随每次改动漂移。
  # 单独跑一遍不是为了"多测一次"，而是把这个数固化进流水线 —— 否则只有谁想起来
  # 手工 `make release` 时才知道 text 涨没涨，而且那次手工常常漏 `-B`。
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出（跳过 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 ARM 工具链
        uses: actions/cache@v4
        with:
          path: tool/linux_x86_64
          key: arm-gnu-${{ runner.os }}-${{ hashFiles('build/contracts.py') }}
          restore-keys: |
            arm-gnu-${{ runner.os }}-

      - name: 安装 ARM 工具链
        run: python3 build/build.py install-toolchain

      - name: 刷新描述文件
        run: python3 build/build.py update

      # -B 由 release 目标自带。OPT/DEBUG 只从命令行覆盖，不改 toolchain.make 的
      # mtime，不带 -B 时 make 判定 elf 最新、拿 -Og 的旧对象重链一遍 —— 全绿、退出 0，
      # 尺寸一个字节没变。
      - name: 发布构建（-Os -g1）
        run: make release

      # 指令形态判据在 -Os 下会跳过 3 条（verify 逐条列出来），其余照跑：
      # 体积上限、库成员、未链接成员这几类在发布档位同样生效。
      - name: 发布产物自检
        run: python3 build/build.py verify --artifacts

  # 门禁红测矩阵：`verify` 的产物断言在代码本来就正确时永远是绿的，
  # 绿一次证明不了它在该报错时会报错 —— 只有把被测条件真破坏一次才叫证据。
  # 组名由 `build.py gate-selftest --list` 输出（`CASES` 是唯一来源），workflow 不硬编码，
  # 新增一组会自动进矩阵；硬编码的话漏同步就是永远漏跑，而且不会有人发现。
  # 每组各自重编（`--only` 不依赖其它组的产物），最慢的 `write` 组要做一次串行全量重编。
  gate-list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - name: 检出（跳过 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 列出红测组
        id: list
        run: echo "groups=$(python3 build/build.py gate-selftest --list)" >> "$GITHUB_OUTPUT"

  gate-selftest:
    needs: gate-list
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.gate-list.outputs.groups) }}
    steps:
      - name: 检出（跳过 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 缓存 ARM 工具链
        uses: actions/cache@v4
        with:
          path: tool/linux_x86_64
          key: arm-gnu-${{ runner.os }}-${{ hashFiles('build/contracts.py') }}
          restore-keys: |
            arm-gnu-${{ runner.os }}-
      - name: 安装 ARM 工具链
        run: python3 build/build.py install-toolchain
      - name: 红测 ${{ matrix.group }}
        run: python3 build/build.py gate-selftest --only "${{ matrix.group }}"
