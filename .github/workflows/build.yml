# 云端构建：把"本机记得 update 再编"变成"推上去就跑"。
# 两步顺序有讲究：
#   1) update + git diff --exit-code —— 抓"改了源文件却忘了 update 就提交"（生成物在库里，漂移看得见）
#   2) build —— 编译并产出 user / userdebug 两档镜像与 release 目录
# 门禁（build/checks/ + build/verify.py + gate-selftest）已于 2026-11-22 整体删除，
# 待重新设计后再接回，现阶段 CI 只保证"能编、能出镜像、生成物不漂"。
# 检出用 lfs: false：构建不需要 docs/ 下的 PDF，指针文件就够，别烧 LFS 下载额度。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出（跳过 LFS）
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 ARM 工具链
        uses: actions/cache@v4
        with:
          path: tool/linux_x86_64
          key: arm-gnu-${{ runner.os }}-${{ hashFiles('build/build.py') }}
          restore-keys: |
            arm-gnu-${{ runner.os }}-

      # 工具链进 tool/linux_x86_64，和本机 tool/win_x86_64 是同一个版本号，
      # 版本由 build/build.py 的 DEFAULT_TOOLCHAIN_VERSION 固定，别在这里另指定。
      - name: 安装 ARM 工具链
        run: python3 build/build.py install-toolchain

      # update 会跑 docs/hardware/pinmap/gen_dts.py 产 default / overlay 两份 dtsi，
      # 合成 apollo.dts 并用 dtc 编出 apollo.dtb；dtc 用 tool/<平台>/bin 里的那份。
      - name: 刷新描述文件（含 DTS → DTB）
        run: python3 build/build.py update

      # 生成物（Makefile / Kconfig / defconfig / dtsi）入库是既定策略，这一条保证它们不和源码脱节；
      # out/ 整目录不入库，update 产出的 .config / dts 不会出现在这里。
      - name: 生成物必须与提交内容一致
        run: |
          git diff --stat
          git diff --exit-code

      - name: 全量构建
        run: python3 build/build.py build

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: stm32-freertos-target
          path: |
            out/user/release/
            out/userdebug/release/
          if-no-files-found: error
